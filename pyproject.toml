[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "GEDICorrect"
version = "1.0.0"
description = "Orbit-, beam-, and footprint-level GEDI geolocation correction using ALS data"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Leonel Corado"},
  {name = "Sérgio Godinho"},
]
keywords = ["GEDI", "LiDAR", "geolocation", "remote sensing", "ALS"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=0.14,<2",
  "laspy>=2.5,<3",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyogrio>=0.7,<1",
  "pyproj>=3.6,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
  "shapely>=2,<3",
  "tables>=3.9,<4",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
ui = ["streamlit>=1.37,<2"]
laz = ["laspy[lazrs]>=2.5,<3"]
raster = ["rasterio>=1.3,<2"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "streamlit>=1.37,<2",
  "twine>=5,<7",
]

[project.scripts]
gedicorrect = "gedicorrect.cli:main"
gedicorrect-ui = "gedicorrect.cli:ui_main"

[project.urls]
Homepage = "https://github.com/leonelluiscorado/GEDICorrect"
Repository = "https://github.com/leonelluiscorado/GEDICorrect"
Issues = "https://github.com/leonelluiscorado/GEDICorrect/issues"
Paper = "https://doi.org/10.1016/j.srs.2026.100469"
Dataset = "https://doi.org/10.5281/zenodo.17494712"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gedicorrect*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
